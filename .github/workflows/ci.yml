name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 是依赖声明的下限（@lancedb/lancedb 要求 >=22），24 是当前开发运行时
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 代码风格检查
        run: npm run lint

      - name: 单元测试
        run: npm test
        env:
          # 测试全程用 FakeLLM，不需要真实 Key；这里给个占位符避免加载配置时报错
          MINIAGENT_DEEPSEEK_API_KEY: test-key
          # 让 vitest 不写新快照：快照漂移应当显式 `npx vitest run -u` 后提交
          CI: "true"

  # 编译产物只有完整环境能产出：轻量环境缺 optional 依赖（vector.ts 的类型导入），
  # tsc 会报 TS2307。所以服务器不编译，只接收这里产出的 dist/。
  build:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖（含 optional，保证类型齐全）
        run: npm ci
        env:
          # 构建期不需要真实 Key，但 loadSettings 会在 import 时校验配置
          MINIAGENT_DEEPSEEK_API_KEY: build-key

      - name: 编译
        run: npm run build
        env:
          MINIAGENT_DEEPSEEK_API_KEY: build-key

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 注意：job 级的 if **不能**引用 secrets 上下文（GitHub 会在派发前就判工作流文件非法，
    # 整个 run 以 0 秒失败、报 "workflow file issue"——已实测踩到）。
    # 所以「Secrets 没配就跳过」的判断放在第一个 step 里，用它的 output 控制后续步骤。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 检查部署凭据是否已配置
        id: guard
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::notice::未配置 SSH_HOST / SSH_PRIVATE_KEY，跳过部署（主干 CI 不受影响）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 首次连接先写入 known_hosts，否则 ssh 会停在交互式确认
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步代码与编译产物
        if: steps.guard.outputs.ready == 'true'
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          TARGET="$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
          # 只同步这一类东西：编译产物、静态资源、技能包、依赖清单。
          # 三条铁律（每条都是实测踩出来的）：
          #   1) 源目录**不带**尾斜杠。写 `public/` 时 rsync 会把 public 的内容展平进
          #      目标目录，实测把 app.js/index.html/styles.css 直接倒进了部署根目录，
          #      而真正的 public/ 从未被更新过（旧内容恰好在，所以没暴露）。
          #      `public` 才会在目标下建出 public/ 子目录。
          #   2) **不加 --delete**。服务器上的 .env / knowledge / memory / history 等
          #      运行时数据必须留着。没有 --delete，也就**不需要任何 --exclude**——
          #      之前那串 --exclude 不但多余，还因为未锚定而把 dist/memory/、dist/history/、
          #      dist/knowledge/ 一并挡掉，导致编译产物缺文件。
          #   3) --no-owner --no-group。否则文件属主被设成 runner 的 uid 1001
          #      （服务器上不存在该用户）。权限统一交给远端那步 chmod 兜住。
          RSYNC_OPTS=(-az --no-perms --no-owner --no-group --omit-dir-times
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT")
          rsync "${RSYNC_OPTS[@]}" \
            dist public skills package.json package-lock.json "$TARGET/"

      - name: 安装运行依赖并重启服务
        if: steps.guard.outputs.ready == 'true'
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME || 'miniagent' }}
        run: |
          # 远端脚本用 heredoc 送过去（`bash -s`），避免多层引号转义；
          # heredoc 不加引号，所以 $DEPLOY_PATH 等在本地展开、\$() 留给远端执行。
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<REMOTE
          set -e
          cd '$DEPLOY_PATH'
          # umask 必须显式设成 022：服务器实测 umask 是 027，npm 会把 node_modules
          # 建成 drwxr-x--- root:root，服务用户读不到，重启后直接 ERR_MODULE_NOT_FOUND
          # 崩溃循环（已实测踩到）。
          umask 0022
          npm ci --omit=dev --omit=optional --no-audit --no-fund
          # 权限统一在这里兜住：rsync 用 --no-perms，落到服务器的权限取决于
          # runner 的 umask 与 artifact 的存储权限（实测 checkout 出来是 640、
          # artifact 是 644）。640 会让服务用户读不到 public/ 而整站 500。
          chmod -R a+rX node_modules dist public skills
          # 配置菜单要改写 .env（原子写会在部署目录建临时文件再 rename），
          # 所以部署目录与 .env 都得让服务用户所在组可写。组名从 systemd 取，不写死。
          SVC_GROUP=\$(systemctl show '$SERVICE_NAME' -p Group --value)
          if [ -n "\$SVC_GROUP" ] && [ "\$SVC_GROUP" != root ]; then
            chgrp "\$SVC_GROUP" '$DEPLOY_PATH'
            chmod 775 '$DEPLOY_PATH'
            if [ -f '$DEPLOY_PATH/.env' ]; then
              chgrp "\$SVC_GROUP" '$DEPLOY_PATH/.env'
              chmod 660 '$DEPLOY_PATH/.env'
            fi
          fi
          sudo systemctl restart '$SERVICE_NAME'
          sleep 3
          systemctl is-active '$SERVICE_NAME'
          REMOTE
